

[env]
TERM = "xterm-256color"

[window]
# Slightly increased padding looks cleaner with "Buttonless"
padding = { x = 15, y = 15 }
decorations = "Buttonless"
opacity = 0.7
blur = true
option_as_alt = "OnlyLeft"
# Dynamic title updates based on what you are running
dynamic_title = true 
startup_mode = "Maximized"


[font]
size = 15.0
# Explicitly defining bold/italic often helps rendering
normal = { family = "MesloLGS Nerd Font Mono", style = "Regular" }
bold = { family = "MesloLGS Nerd Font Mono", style = "Bold" }
italic = { family = "MesloLGS Nerd Font Mono", style = "Italic" }
# Slight vertical spacing tweak for "breathing room"
offset = { x = 0, y = 1 } 

[cursor]
# "Beam" is often preferred for coding, "Block" for classic vibe
style = { shape = "Beam", blinking = "On" }
blink_interval = 750
unfocused_hollow = true

[scrolling]
history = 10000
multiplier = 3

# --- Theme: Catppuccin Mocha ---
